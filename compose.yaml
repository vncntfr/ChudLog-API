services:
  api:
    build: .
    env_file: ${APP_ENV_FILE:-.env.production}
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      DB_PATH: /data/chudlog.db
      BACKUP_DIRECTORY: /backups
    volumes:
      - sqlite:/data
      - ${BACKUP_HOST_PATH:-./backups}:/backups
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build: ../ChudLog
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-chudlog.xyz}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  sqlite:
  caddy_data:
  caddy_config:
